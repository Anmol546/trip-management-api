services:
  postgres:
    image: postgres:16-alpine
    container_name: trip-postgres
    environment:
      POSTGRES_DB: tripdb
      POSTGRES_USER: trip
      POSTGRES_PASSWORD: trip
    ports:
      - "5432:5432"
    volumes:
      - trip-postgres-data:/var/lib/postgresql/data
    healthcheck:
      # The app must not start migrating before Postgres is accepting connections.
      test: ["CMD-SHELL", "pg_isready -U trip -d tripdb"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  trip-postgres-data:
