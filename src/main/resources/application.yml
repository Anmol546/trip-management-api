spring:
  application:
    name: trip-management-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tripdb}
    username: ${DB_USER:trip}
    password: ${DB_PASSWORD:trip}
    hikari:
      pool-name: trip-pool
      maximum-pool-size: ${DB_POOL_SIZE:10}
      # Guards against a long running request holding a connection while it waits
      # on a concurrent status update.
      connection-timeout: 5000

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Hibernate only verifies that the mapping still
      # matches what the migrations produced, so a mapping drift fails fast on
      # startup instead of at the first request.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          # Persist Instant as TIMESTAMP rather than TIMESTAMP WITH TIME ZONE so
          # the same migration runs on PostgreSQL and on the H2 test database.
          # Everything written is UTC.
          preferred_instant_jdbc_type: TIMESTAMP
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  level:
    com.anmol.trip: ${LOG_LEVEL:INFO}
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} - %msg%n"
